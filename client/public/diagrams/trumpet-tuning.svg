<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 168" role="img" aria-label="Trumpet tuning: the main tuning slide, nearest you" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<title>Trumpet tuning: the main tuning slide, nearest you</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f2c14e"/></marker></defs>
<rect x="150" y="62" width="250" height="30" rx="4" fill="#1a1a28" stroke="#8b8b9f"/>
<rect x="48" y="59" width="108" height="36" rx="5" fill="#7c5cff" opacity="0.32" stroke="#7c5cff" stroke-width="2"/>
<text x="102" y="81.0" font-size="12" fill="#e6e6f0" text-anchor="middle">main slide</text>
<text x="275" y="81.0" font-size="11" fill="#8b8b9f" text-anchor="middle">body</text>
<path d="M96 44 L48 44" stroke="#f2c14e" stroke-width="2" marker-end="url(#a)"/>
<path d="M110 110 L158 110" stroke="#f2c14e" stroke-width="2" marker-end="url(#a)"/>
<text x="48" y="36" font-size="11" fill="#f2c14e">pull out → flatter</text>
<text x="112" y="126" font-size="11" fill="#f2c14e">push in → sharper</text>
<text x="20" y="154" font-size="11" fill="#8b8b9f">a few millimetres is a lot — warm up before tuning</text>
</svg>
