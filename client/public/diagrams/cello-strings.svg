<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 174" role="img" aria-label="Cello open strings: C2 G2 D3 A3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<title>Cello open strings: C2 G2 D3 A3</title>
<text x="20" y="20" font-size="11" fill="#8b8b9f">open strings, lowest to highest</text>
<line x1="70" y1="34" x2="280" y2="34" stroke="#e6e6f0" stroke-width="2.40"/>
<text x="58" y="38" font-size="13" fill="#e6e6f0" text-anchor="end">C2</text>
<line x1="70" y1="60" x2="280" y2="60" stroke="#e6e6f0" stroke-width="1.95"/>
<text x="58" y="64" font-size="13" fill="#e6e6f0" text-anchor="end">G2</text>
<line x1="70" y1="86" x2="280" y2="86" stroke="#e6e6f0" stroke-width="1.50"/>
<text x="58" y="90" font-size="13" fill="#e6e6f0" text-anchor="end">D3</text>
<line x1="70" y1="112" x2="280" y2="112" stroke="#e6e6f0" stroke-width="1.05"/>
