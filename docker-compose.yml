# Local Postgres for development. Production is a managed free-tier instance
# (Neon or Supabase); nothing here is deployed.
services:
  db:
    image: postgres:17-alpine
    container_name: pitchwise-db
    environment:
      POSTGRES_USER: pitchwise
      POSTGRES_PASSWORD: pitchwise
      POSTGRES_DB: pitchwise
    ports:
      - "5433:5432"   # 5433 on the host, so a system Postgres on 5432 is untouched
    volumes:
      - pitchwise-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitchwise"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pitchwise-pgdata:
